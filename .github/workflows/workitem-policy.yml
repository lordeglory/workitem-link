# The job `name` below is the status check GitHub shows in
# Settings → Branches → Require status checks to pass before merging.
name: Work item policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: workitem-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  workitem-linked:
    name: Work item linked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce work-item link
        run: node src/check.js
        env:
          ADO_ORGANIZATION: ${{ vars.ADO_ORGANIZATION }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
